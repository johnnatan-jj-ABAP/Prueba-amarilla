<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas para Ti 💛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #fffaeb 0%, #ffe082 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            text-align: center;
            padding: 40px 20px;
        }

        .container {
            animation: fadeIn 2s ease-in-out forwards;
            z-index: 5;
            margin-top: 20px;
        }

        h1 {
            color: #b58100;
            font-size: 2.5rem;
            margin-bottom: 12px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.08);
        }

        p {
            color: #795548;
            font-size: 1.3rem;
            font-weight: 500;
            max-width: 400px;
            margin: 0 auto;
        }

        /* Contenedor Completo de la Planta */
        .flower-garden {
            position: relative;
            width: 200px;
            height: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 20px;
            z-index: 5;
        }

        /* Contenedor de la Flor */
        .flower-head {
            position: absolute;
            top: 0;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .flower {
            position: relative;
            width: 100%;
            height: 100%;
            animation: spin 30s linear infinite, scaleUp 1.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Diseño de los pétalos */
        .petal {
            position: absolute;
            background: #ffd54f;
            border: 2px solid #ffca28;
            border-radius: 0 70% 0 70%;
            width: 65px;
            height: 65px;
            top: 35px;
            left: 100px;
            transform-origin: 0% 100%;
            opacity: 0.95;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .petal:nth-child(1) { transform: rotate(0deg); }
        .petal:nth-child(2) { transform: rotate(45deg); }
        .petal:nth-child(3) { transform: rotate(90deg); }
        .petal:nth-child(4) { transform: rotate(135deg); }
        .petal:nth-child(5) { transform: rotate(180deg); }
        .petal:nth-child(6) { transform: rotate(225deg); }
        .petal:nth-child(7) { transform: rotate(270deg); }
        .petal:nth-child(8) { transform: rotate(315deg); }

        /* Centro de la flor */
        .center {
            position: absolute;
            background: #ffb300;
            border: 3px solid #ffa000;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            z-index: 10;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.15), 0 4px 8px rgba(0,0,0,0.1);
        }

        /* Tallo de la flor */
        .stem {
            width: 10px;
            height: 220px;
            background: linear-gradient(to bottom, #4caf50, #2e7d32);
            border-radius: 5px;
            position: relative;
            z-index: 2;
            animation: growStem 2s ease-out forwards;
            transform-origin: bottom center;
        }

        /* Hojas del tallo */
        .leaf {
            position: absolute;
            background: linear-gradient(to right, #81c784, #4caf50);
            border: 1px solid #388e3c;
            width: 45px;
            height: 25px;
            border-radius: 0 100% 0 100%;
            opacity: 0;
            animation: fadeInLeaf 1s 1.5s ease-out forwards;
        }

        .leaf.left {
            left: -40px;
            top: 70px;
            transform: rotate(-15deg);
        }

        .leaf.right {
            right: -40px;
            top: 120px;
            transform: scaleX(-1) rotate(-15deg);
        }

        /* Sistema de lluvia de pétalos */
        .falling-petals {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .falling-petal {
            position: absolute;
            background: #ffe082;
            border-radius: 0 80% 0 80%;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleUp {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        @keyframes growStem {
            from { transform: scaleY(0); }
            to { transform: scaleY(1); }
        }

        @keyframes fadeInLeaf {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fall {
            0% {
                top: -50px;
                transform: translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% {
                top: 105vh;
                transform: translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Lluvia de pétalos en el fondo -->
    <div class="falling-petals">
        <div class="falling-petal" style="width: 15px; height: 15px; left: 10%; animation-duration: 6s; animation-delay: 0s;"></div>
        <div class="falling-petal" style="width: 20px; height: 20px; left: 30%; animation-duration: 8s; animation-delay: 2s;"></div>
        <div class="falling-petal" style="width: 12px; height: 12px; left: 55%; animation-duration: 5s; animation-delay: 1s;"></div>
        <div class="falling-petal" style="width: 18px; height: 18px; left: 75%; animation-duration: 7s; animation-delay: 3s;"></div>
        <div class="falling-petal" style="width: 15px; height: 15px; left: 90%; animation-duration: 6s; animation-delay: 4s;"></div>
        <div class="falling-petal" style="width: 22px; height: 22px; left: 20%; animation-duration: 9s; animation-delay: 5s;"></div>
        <div class="falling-petal" style="width: 14px; height: 14px; left: 45%; animation-duration: 6s; animation-delay: 1.5s;"></div>
        <div class="falling-petal" style="width: 16px; height: 16px; left: 65%; animation-duration: 7.5s; animation-delay: 0.5s;"></div>
    </div>

    <div class="container">
        <h1>¡Feliz 21 de Septiembre! 🌼</h1>
        <p>Te prometí que hoy no te quedarías sin tus flores amarillas...</p>
    </div>
    
    <div class="flower-garden">
        <div class="flower-head">
            <div class="flower">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
            </div>
            <div class="center"></div>
        </div>
        <div class="stem">
            <div class="leaf left"></div>
            <div class="leaf right"></div>
        </div>
    </div>

</body>
</html>
