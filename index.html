<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas para Ti 💛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #fffaeb 0%, #ffe082 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            text-align: center;
            padding: 30px 15px;
            position: relative;
        }

        .container {
            z-index: 10;
            margin-top: 45px;
            width: 100%;
            max-width: 450px;
        }

        h1 {
            color: #b58100;
            font-size: 2rem;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.06);
        }

        /* Efecto Máquina de Escribir Nativo */
        .typewriter-container {
            display: inline-block;
            max-width: 100%;
            padding: 0 10px;
        }

        .typewriter-text {
            color: #795548;
            font-size: 1.1rem;
            font-weight: 500;
            margin: 0 auto;
            border-right: 2px solid #795548;
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            animation: 
                typing 3.5s steps(40, end) forwards,
                blink 0.75s step-end infinite;
        }

        /* El Ramo de las 8 flores */
        .garden {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            width: 100%;
            max-width: 550px;
            height: 400px;
            position: relative;
            z-index: 20;
            margin-bottom: 10px;
        }

        /* Flor con reacción física al pasar el cursor o tocar */
        .flower-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 11%;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* REACCIÓN INTERACTIVA: Crece y resalta al pasar el mouse o tocar */
        .flower-wrapper:hover {
            transform: scale(1.25) translateY(-10px) !important;
            z-index: 50 !important;
        }

        /* Variación de escalas base en el ramo */
        .f1 { transform: scale(1.1); z-index: 5; }
        .f2 { transform: scale(0.9); z-index: 4; }
        .f3 { transform: scale(1.0); z-index: 4; }
        .f4 { transform: scale(0.85); z-index: 3; }
        .f5 { transform: scale(0.95); z-index: 3; }
        .f6 { transform: scale(0.8); z-index: 2; }
        .f7 { transform: scale(0.85); z-index: 2; }
        .f8 { transform: scale(0.75); z-index: 1; }

        .flower-head {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .flower {
            position: relative;
            width: 100%;
            height: 100%;
            animation: spin 30s linear infinite, scaleUp 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .petal {
            position: absolute;
            background: #ffd54f;
            border: 2px solid #ffca28;
            border-radius: 0 70% 0 70%;
            width: 26px;
            height: 26px;
            top: 14px;
            left: 40px;
            transform-origin: 0% 100%;
            opacity: 0.95;
        }

        .petal:nth-child(1) { transform: rotate(0deg); }
        .petal:nth-child(2) { transform: rotate(45deg); }
        .petal:nth-child(3) { transform: rotate(90deg); }
        .petal:nth-child(4) { transform: rotate(135deg); }
        .petal:nth-child(5) { transform: rotate(180deg); }
        .petal:nth-child(6) { transform: rotate(225deg); }
        .petal:nth-child(7) { transform: rotate(270deg); }
        .petal:nth-child(8) { transform: rotate(315deg); }

        .center {
            position: absolute;
            background: #ffb300;
            border: 2px solid #ffa000;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            z-index: 10;
            transition: background 0.3s, box-shadow 0.3s;
        }

        /* El centro de la flor brilla cuando pasas el cursor por la flor */
        .flower-wrapper:hover .center {
            background: #ffca28;
            box-shadow: 0 0 12px #ffb300, inset 0 0 4px #fff;
        }

        .stem {
            width: 5px;
            background: linear-gradient(to bottom, #4caf50, #2e7d32);
            border-radius: 3px;
            transform-origin: bottom center;
            animation: growStem 2s ease-out forwards;
        }

        .f1 .stem { height: 230px; }
        .f2 .stem { height: 185px; }
        .f3 .stem { height: 205px; }
        .f4 .stem { height: 155px; }
        .f5 .stem { height: 175px; }
        .f6 .stem { height: 135px; }
        .f7 .stem { height: 145px; }
        .f8 .stem { height: 125px; }

        .leaf {
            position: absolute;
            background: linear-gradient(to right, #81c784, #4caf50);
            border: 1px solid #388e3c;
            width: 18px;
            height: 11px;
            border-radius: 0 100% 0 100%;
            opacity: 0;
            animation: fadeInLeaf 1s 1.5s ease-out forwards;
        }

        .leaf.left { left: -14px; top: 40px; transform: rotate(-15deg); }
        .leaf.right { right: -14px; top: 60px; transform: scaleX(-1) rotate(-15deg); }

        /* Lluvia decorativa constante de fondo */
        .falling-petals {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; pointer-events: none; z-index: 1;
        }

        .falling-petal {
            position: absolute;
            background: #ffe082;
            border-radius: 0 80% 0 80%;
            opacity: 0.6;
            animation: fall 5s linear infinite;
        }

        /* Animaciones */
        @keyframes typing { from { width: 0; } to { width: 100%; } }
        @keyframes blink { from, to { border-color: transparent; } 50% { border-color: #795548; } }
        @keyframes scaleUp { from { transform: scale(0); } to { transform: scale(1); } }
        @keyframes growStem { from { transform: scaleY(0); } to { transform: scaleY(1); } }
        @keyframes fadeInLeaf { from { opacity: 0; } to { opacity: 1; } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes fall {
            0% { transform: translateY(-40px) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>

    <!-- Lluvia decorativa de fondo -->
    <div class="falling-petals">
        <div class="falling-petal" style="left: 10%; animation-duration: 6s; width: 14px; height: 14px;"></div>

        <div class="falling-petal" style="left: 50%; animation-duration: 5s; animation-delay: 1s; width: 12px; height: 12px;"></div>
        <div class="falling-petal" style="left: 70%; animation-duration: 7s; animation-delay: 3s; width: 16px; height: 16px;"></div>
        <div class="falling-petal" style="left: 85%; animation-duration: 6s; animation-delay: 1.5s; width: 14px; height: 14px;"></div>
    </div>

    <!-- Cabecera con Texto Tipo Máquina de Escribir -->
    <div class="container">

        <div class="typewriter-container">
