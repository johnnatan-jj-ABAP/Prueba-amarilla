<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas para Ti 💛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #fffaeb 0%, #ffe082 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            text-align: center;
            padding: 20px 15px;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Marcador flotante del juego */
        .score-board {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            color: #b58100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            font-size: 0.9rem;
            z-index: 30;
            border: 1.5px solid #ffd54f;
        }

        .container {
            z-index: 10;
            margin-top: 45px;
            width: 100%;
            max-width: 450px;
        }

        h1 {
            color: #b58100;
            font-size: 2rem;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.06);
        }

        /* Contenedor del efecto Máquina de Escribir */
        .typewriter-container {
            display: inline-block;
            max-width: 100%;
            padding: 0 10px;
        }

        .typewriter-text {
            color: #795548;
            font-size: 1.1rem;
            font-weight: 500;
            margin: 0 auto;
            border-right: 2px solid #795548;
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            animation: 
                typing 3.5s steps(40, end) forwards,
                blink 0.75s step-end infinite;
        }

        /* Jardín estático contenedor de las 8 flores */
        .garden {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            width: 100%;
            max-width: 550px;
            height: 400px;
            position: relative;
            z-index: 5;
            margin-bottom: 10px;
        }

        /* Estructura base de cada flor */
        .flower-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 11%;
        }

        /* Ajustes de escala y capas */
        .f1 { transform: scale(1.1); z-index: 5; }
        .f2 { transform: scale(0.9); z-index: 4; }
        .f3 { transform: scale(1.0); z-index: 4; }
        .f4 { transform: scale(0.85); z-index: 3; }
        .f5 { transform: scale(0.95); z-index: 3; }
        .f6 { transform: scale(0.8); z-index: 2; }
        .f7 { transform: scale(0.85); z-index: 2; }
        .f8 { transform: scale(0.75); z-index: 1; }

        .flower-head {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .flower {
            position: relative;
            width: 100%;
            height: 100%;
            animation: spin 30s linear infinite, scaleUp 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .petal {
            position: absolute;
            background: #ffd54f;
            border: 2px solid #ffca28;
            border-radius: 0 70% 0 70%;
            width: 26px;
            height: 26px;
            top: 14px;
            left: 40px;
            transform-origin: 0% 100%;
            opacity: 0.95;
            box-shadow: 0 4px 8px rgba(0,0,0,0.03);
        }

        .petal:nth-child(1) { transform: rotate(0deg); }
        .petal:nth-child(2) { transform: rotate(45deg); }
        .petal:nth-child(3) { transform: rotate(90deg); }
        .petal:nth-child(4) { transform: rotate(135deg); }
        .petal:nth-child(5) { transform: rotate(180deg); }
        .petal:nth-child(6) { transform: rotate(225deg); }
        .petal:nth-child(7) { transform: rotate(270deg); }
        .petal:nth-child(8) { transform: rotate(315deg); }

        .center {
            position: absolute;
            background: #ffb300;
            border: 2px solid #ffa000;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            z-index: 10;
            box-shadow: inset 0 0 6px rgba(0,0,0,0.15);
        }

        .stem {
            width: 5px;
            background: linear-gradient(to bottom, #4caf50, #2e7d32);
            border-radius: 3px;
            transform-origin: bottom center;
            animation: growStem 2s ease-out forwards;
        }

        .f1 .stem { height: 230px; }
        .f2 .stem { height: 185px; }
        .f3 .stem { height: 205px; }
        .f4 .stem { height: 155px; }
        .f5 .stem { height: 175px; }
        .f6 .stem { height: 135px; }
        .f7 .stem { height: 145px; }
        .f8 .stem { height: 125px; }

        .leaf {
            position: absolute;
            background: linear-gradient(to right, #81c784, #4caf50);
            border: 1px solid #388e3c;
            width: 18px;
            height: 11px;
            border-radius: 0 100% 0 100%;
            opacity: 0;
            animation: fadeInLeaf 1s 1.5s ease-out forwards;
        }

        .leaf.left { left: -14px; top: 40px; transform: rotate(-15deg); }
        .leaf.right { right: -14px; top: 60px; transform: scaleX(-1) rotate(-15deg); }

        /* Capa del Minijuego de Pétalos */
        #game-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20;
            overflow: hidden;
        }

        .interactive-petal {
            position: absolute;
            background: #ffe082;
            border: 1px solid #ffd54f;
            border-radius: 0 80% 0 80%;
            opacity: 0.85;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            top: -40px;
            animation: fall linear forwards;
        }

        /* Animaciones nativas */
        @keyframes typing { from { width: 0; } to { width: 100%; } }
        @keyframes blink { from, to { border-color: transparent; } 50% { border-color: #795548; } }
        @keyframes scaleUp { from { transform: scale(0); } to { transform: scale(1); } }
        @keyframes growStem { from { transform: scaleY(0); } to { transform: scaleY(1); } }
        @keyframes fadeInLeaf { from { opacity: 0; } to { opacity: 1; } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.85; }
            90% { opacity: 0.85; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Marcador de Puntos -->
    <div class="score-board">🌼 Pétalos atrapados: <span id="score">0</span></div>

    <!-- Contenedor del Juego -->
    <div id="game-container"></div>

    <!-- Cabecera con Texto Animado -->
    <div class="container">
        <h1>¡Feliz 21 de Septiembre, ! 🌼</h1>
        <div class="typewriter-container">
            <!-- Texto que se autoredacta como máquina de escribir -->
            <div class="typewriter-text">Un detalle digital para ti.. ✨</div>
        </div>
    </div>
    
    <!-- El Ramo de 8 Flores Estable -->
    <div class="garden">
        <div class="flower-wrapper f6"><div class="flower-head"><div class="flower"><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div></div><div class="center"></div></div><div class="stem"><div class="leaf left"></div></div></div>
        <div class="flower-wrapper f4"><div class="flower-head"><div class="flower"><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div></div><div class="center"></div></div><div class="stem"><div class="leaf right"></div></div></div>
        <div class="flower-wrapper f2"><div class="flower-head"><div class="flower"><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div></div><div class="center"></div></div><div class="stem"><div class="leaf left"></div></div></div>
        <div class="flower-wrapper f1"><div class="flower-head"><div class="flower"><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div></div><div class="center"></div></div><div class="stem"><div class="leaf left"></div><div class="leaf right"></div></div></div>
        <div class="flower-wrapper f3"><div class="flower-head"><div class="flower"><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div></div><div class="center"></div></div><div class="stem"><div class="leaf right"></div></div></div>
